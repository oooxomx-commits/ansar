<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة المدير - التجمع المدني العراقي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Noto Sans Arabic', sans-serif; }</style>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">
  <header class="bg-blue-900 text-white p-4 shadow-md sticky top-0 z-40">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-blue-900 font-bold">🏛️</div>
        <div>
          <h1 class="font-bold text-base">لوحة تحكم المدير</h1>
          <p class="text-xs text-blue-200">إدارة الطلبات والأعضاء</p>
        </div>
      </div>
      <a href="index.html" class="text-xs bg-blue-800 border border-blue-600 px-3 py-1.5 rounded-lg text-white">برنامج الضيوف</a>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 mt-4 space-y-4">
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-white p-4 rounded-xl border border-slate-200 text-center shadow-sm">
        <span class="text-xs text-slate-500 font-medium">إجمالي الطلبات</span>
        <div class="text-2xl font-bold text-blue-900 mt-1" id="statTotal">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 text-center shadow-sm">
        <span class="text-xs text-slate-500 font-medium">طلبات قيد المراجعة</span>
        <div class="text-2xl font-bold text-amber-600 mt-1" id="statPending">0</div>
      </div>
    </div>

    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
      <div class="flex items-center justify-between border-b pb-2">
        <h2 class="font-bold text-sm text-slate-800">قائمة الطلبات الواردة</h2>
        <span class="text-xs bg-slate-100 px-2 py-1 rounded text-slate-600">مباشر</span>
      </div>
      <div id="requestsList" class="space-y-3">
        <p class="text-center text-slate-400 text-sm py-6">جاري جلب الطلبات...</p>
      </div>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();

    db.collection("requests").orderBy("createdAt", "desc").onSnapshot(snapshot => {
      const list = document.getElementById("requestsList");
      let total = snapshot.size;
      let pending = 0;
      if (snapshot.empty) {
        list.innerHTML = '<p class="text-center text-slate-400 text-sm py-6">لا توجد طلبات واردة حالياً.</p>';
        document.getElementById("statTotal").innerText = 0;
        document.getElementById("statPending").innerText = 0;
        return;
      }
      let html = '';
      snapshot.forEach(doc => {
        const d = doc.data();
        if (d.status === "قيد المراجعة") pending++;
        html += `
          <div class="border border-slate-200 rounded-xl p-3 bg-slate-50 space-y-2">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="font-bold text-sm text-slate-900">${d.fullName || 'بدون اسم'}</h3>
                <p class="text-xs text-slate-500">${d.phone || ''} | ${d.center || ''}</p>
              </div>
              <span class="text-xs px-2 py-0.5 rounded font-semibold ${d.status === 'مقبول' ? 'bg-green-100 text-green-700' : (d.status === 'مرفوض' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700')}">${d.status || 'قيد المراجعة'}</span>
            </div>
            <div class="text-xs bg-white p-2 rounded border border-slate-100 text-slate-700">
              <span class="font-semibold text-blue-900">[${d.reqType || 'معاملة'}]:</span> ${d.notes || 'لا توجد ملاحظات'}
            </div>
            <div class="flex gap-2 pt-1">
              <button onclick="updateStatus('${doc.id}', 'مقبول')" class="flex-1 py-1 text-xs bg-green-600 hover:bg-green-700 text-white rounded font-medium">قبول</button>
              <button onclick="updateStatus('${doc.id}', 'مرفوض')" class="flex-1 py-1 text-xs bg-red-600 hover:bg-red-700 text-white rounded font-medium">رفض</button>
            </div>
          </div>
        `;
      });
      list.innerHTML = html;
      document.getElementById("statTotal").innerText = total;
      document.getElementById("statPending").innerText = pending;
    });

    function updateStatus(id, newStatus) {
      db.collection("requests").doc(id).update({ status: newStatus });
    }
  </script>
</body>
</html>
