<title>مساعد تجمع الأنصار الشبابي</title>
<style>
:root{--bg:#eef4fc;--card:#fff;--tx:#12233d;--mu:#5b6e8a;--pr:#1565c0;--bd:#d3e1f4;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#0e1624;--card:#16213a;--tx:#e6eefb;--mu:#93a6c4;--pr:#5aa2f0;--bd:#27395a;--bad:#e5675a}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx)}
header{background:linear-gradient(#e3efff,#b9d6fb);color:#0d3b7a;padding:16px 16px 14px;text-align:center}
header h1{margin:0;font-size:22px}header p{margin:4px 0 8px;font-size:13px}.pill{display:inline-block;background:#0d3b7a;color:#fff;padding:6px 22px;border-radius:20px;font-size:14px}
nav{display:flex;gap:8px;padding:12px;max-width:600px;margin:auto}
nav button{flex:1}
main{max-width:600px;margin:auto;padding:12px 12px 120px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-size:14px;margin:12px 0 4px;color:var(--mu)}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:12px 14px;border:0;border-radius:10px;background:var(--pr);color:#fff;font:inherit;cursor:pointer}
button.sec{background:transparent;color:var(--pr);border:1px solid var(--pr)}
button.bad{background:var(--bad)}
button.full{width:100%;margin-top:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row button{flex:1;padding:9px}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;border:1px solid var(--pr);color:var(--pr)}
.tag.ok{background:var(--pr);color:#fff}.tag.no{border-color:var(--bad);color:var(--bad)}
.hid{display:none}.mu{color:var(--mu);font-size:13px}
h3{margin:-16px -16px 8px;padding:10px 16px;font-size:16px;background:#0d3b7a;color:#fff;border-radius:14px 14px 0 0;text-align:center}button.g{background:#2e8b3d}#bar{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#0d3b7a;color:#fff}#st{display:flex;justify-content:space-between;font-size:12px;padding:5px 14px;background:#08295a}#st i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#37c05a;margin-left:6px}#nv{display:flex;padding:4px 4px calc(6px + env(safe-area-inset-bottom,0px))}#nv button{flex:1;background:transparent;color:#cfe0fa;border-radius:10px;font-size:12px;padding:7px 2px;line-height:1.5}#nv button span{display:block;font-size:18px}#nv button.on{background:#1565c0;color:#fff}
</style>
</head>

<main>

<section id="v1">
 <div class="card">
  <label>نوع الطلب</label>
  <select id="type" onchange="chg()">
   <option>مقابلة المدير</option><option>مقابلة شخص آخر</option><option>تسجيل</option><option>حجز</option>
  </select>
  <div id="whoBox" class="hid"><label>اسم الشخص المطلوب مقابلته</label><input id="who"></div>
  <label>الاسم الكامل</label><input id="name">
  <label>رقم الهاتف</label><input id="phone" type="tel" inputmode="tel" dir="ltr">
  <label>اسم المنطقة</label><input id="area" placeholder="مثال: حي الجامعة">
  <div id="dtBox"><label>التاريخ المقترح</label><input id="date" type="date">
  <label>الوقت المقترح</label><input id="time" type="time"></div>
  <label>سبب المقابلة</label><textarea id="note" rows="3" placeholder="اكتب سبب المقابلة أو الطلب"></textarea>
  <button class="full" onclick="send()">إرسال الطلب</button>
 </div>
 <div id="done" class="card hid"></div>
</section>

<section id="v2" class="hid">
 <div id="login" class="card">
  <label>الرمز السري للإدارة</label><input id="pin" type="password" inputmode="numeric" dir="ltr">
  <button class="full" onclick="enter()">دخول</button>
  <p class="mu">الرمز الافتراضي: 1234 (غيّره بعد الدخول)</p>
 </div>
 <div id="admin" class="hid">
  <div id="reqPane">
  <div class="card">
   <select id="flt" onchange="draw()"><option value="">كل الطلبات</option><option>جديد</option><option>مقبول</option><option>مرفوض</option></select>
  </div>
  <div id="list"></div></div>
  <div id="memPane" class="hid">
   <div class="card">
    <h3 id="mtitle">إضافة عضو</h3>
    <label>الاسم الكامل</label><input id="mname">
    <label>الصفة</label><select id="mrole"></select>
    <label>القسم</label><select id="mdept"></select>
    <label>رقم الهاتف</label><input id="mphone" type="tel" inputmode="tel" dir="ltr">
    <label>تاريخ الانضمام</label><input id="mjoin" type="date">
    <label>الحالة</label><select id="mstat"><option>فعال</option><option>غير فعال</option><option>موقوف</option></select>
    <label>ملاحظات</label><textarea id="mnote" rows="2"></textarea>
    <button class="full g" onclick="mSave()" id="msave">إضافة عضو جديد</button>
    <button class="full sec" onclick="mClear()">مسح الحقول / إلغاء التعديل</button>
   </div>
   <div class="card">
    <label style="margin-top:0">بحث سريع</label><input id="msearch" placeholder="أدخل الاسم أو الرقم..." oninput="mDraw()">
    <div style="display:flex;gap:8px"><div style="flex:1"><label>القسم</label><select id="mfd" onchange="mDraw()"></select></div>
    <div style="flex:1"><label>الصفة</label><select id="mfr" onchange="mDraw()"></select></div></div>
    <p class="mu" id="mcount"></p>
   </div>
   <div id="mlist"></div>
   <div class="row" style="margin-bottom:12px"><button class="sec" onclick="mPrint()">طباعة القائمة</button><button class="sec" onclick="mCsv()">تصدير الأعضاء (CSV)</button></div>
  </div>
  <div id="setPane" class="hid"><div class="card">
   <h3>الإعدادات</h3>
   <label>رقم واتساب الإدارة (بصيغة دولية بدون +، مثال 9647701234567)</label><input id="wa" dir="ltr" inputmode="tel">
   <label>رمز سري جديد</label><input id="np" dir="ltr" inputmode="numeric">
   <button class="full" onclick="saveCfg()">حفظ الإعدادات</button>
   <div class="row"><button class="sec" onclick="exportCsv()">تصدير الطلبات (CSV)</button><button class="sec" onclick="lock()">خروج</button></div>
  </div></div>
 </div>
</section>
</main>

<div id="bar"><div id="st"><span><i></i>جاهز للعمل</span><span id="clk"></span></div>
<div id="nv"><button id="nb0" class="on" onclick="go(0)"><span>➕</span>طلب جديد</button><button id="nb1" onclick="go(1)"><span>📋</span>الطلبات</button><button id="nb2" onclick="go(2)"><span>👥</span>الأعضاء</button><button id="nb3" onclick="go(3)"><span>⚙️</span>الإعدادات</button></div></div>
<script>
const $=id=>document.getElementById(id);
function get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('تعذر الحفظ على هذا الجهاز')}}
let cfg=get('cfg',{pin:'1234',wa:''}), reqs=get('reqs',[]);
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function show(v){['v1','v2'].forEach(x=>$(x).classList.toggle('hid',x!==v))}
let isAdmin=false,pend=1;
function mark(n){for(let k=0;k<4;k++)$('nb'+k).className=k===n?'on':''}
function go(n){mark(n);if(n===0){show('v1');return}show('v2');if(!isAdmin){pend=n;return}pane(n)}
function tick(){$('clk').textContent=new Date().toLocaleString('ar-IQ',{dateStyle:'short',timeStyle:'short'})}
tick();setInterval(tick,30000);
function chg(){const t=$('type').value;$('whoBox').classList.toggle('hid',t!=='مقابلة شخص آخر');
 $('dtBox').classList.toggle('hid',t==='تسجيل')}
function send(){
 const r={id:Date.now(),type:$('type').value,who:$('who').value.trim(),name:$('name').value.trim(),
  phone:$('phone').value.trim(),area:$('area').value.trim(),date:$('date').value,time:$('time').value,note:$('note').value.trim(),
  status:'جديد',created:new Date().toLocaleString('ar-IQ')};
 if(!r.name||!r.phone||!r.area||!r.note){alert('يرجى كتابة الاسم والهاتف والمنطقة وسبب المقابلة');return}
 if(r.type==='مقابلة شخص آخر'&&!r.who){alert('اكتب اسم الشخص المطلوب');return}
 reqs.unshift(r);set('reqs',reqs);
 const msg=`طلب جديد (${r.type})\nالاسم: ${r.name}\nالهاتف: ${r.phone}\nالمنطقة: ${r.area}`+(r.who?`\nالمطلوب: ${r.who}`:'')+
  (r.date?`\nالموعد المقترح: ${r.date} ${r.time}`:'')+`\nسبب المقابلة: ${r.note}`;
 const d=$('done');d.classList.remove('hid');
 d.innerHTML=`<h3>تم تسجيل طلبك ✔</h3><p class="mu">رقم الطلب: ${String(r.id).slice(-6)}</p>
 <p>لكي يصل الطلب للإدارة، اضغط الزر التالي لإرساله عبر واتساب.</p>`+
 (cfg.wa?`<a href="https://wa.me/${cfg.wa}?text=${encodeURIComponent(msg)}" target="_blank"><button class="full">إرسال عبر واتساب</button></a>`
 :`<p class="mu">لم يُضبط رقم واتساب الإدارة بعد (من صفحة الإدارة).</p>`);
 ['who','name','phone','area','date','time','note'].forEach(i=>$(i).value='');
}
function enter(){if($('pin').value===cfg.pin){isAdmin=true;$('login').classList.add('hid');$('admin').classList.remove('hid');$('wa').value=cfg.wa;draw();pane(pend)}else alert('الرمز غير صحيح');$('pin').value=''}
function lock(){isAdmin=false;$('admin').classList.add('hid');$('login').classList.remove('hid');go(0)}
function draw(){
 const f=$('flt').value,L=reqs.filter(r=>!f||r.status===f);
 $('list').innerHTML=L.length?L.map(r=>`<div class="card"><div><b>${esc(r.name)}</b> <span class="tag ${r.status==='مقبول'?'ok':r.status==='مرفوض'?'no':''}">${r.status}</span></div>
 <div class="mu">${esc(r.type)}${r.who?' — '+esc(r.who):''}</div>
 <div dir="ltr" style="text-align:right">${esc(r.phone)}</div>
 ${r.date?`<div>الموعد: ${esc(r.date)} ${esc(r.time)}</div>`:''}
 <div>المنطقة: ${esc(r.area)}</div><div>السبب: ${esc(r.note)}</div><div class="mu">${esc(r.created)}</div>
 <div class="row"><button class="g" onclick="st(${r.id},'مقبول')">قبول</button><button class="bad" onclick="st(${r.id},'مرفوض')">رفض</button>
 <button class="sec" onclick="reply(${r.id})">رد واتساب</button><button class="sec" onclick="del(${r.id})">حذف</button></div></div>`).join(''):'<div class="card mu">لا توجد طلبات</div>';
}
function st(id,s){const r=reqs.find(x=>x.id===id);if(r){r.status=s;set('reqs',reqs);draw()}}
function del(id){if(confirm('حذف الطلب؟')){reqs=reqs.filter(x=>x.id!==id);set('reqs',reqs);draw()}}
function when(r){
 if(!r.date)return '';
 const d=new Date(r.date+'T00:00:00');
 const day=d.toLocaleDateString('ar-IQ',{weekday:'long'});
 let t='';
 if(r.time){const[h,m]=r.time.split(':').map(Number);t=` الساعة ${(h%12)||12}:${String(m).padStart(2,'0')} ${h<12?'صباحاً':'مساءً'}`}
 return `يوم ${day} الموافق ${r.date}${t}`}
function reply(id){const r=reqs.find(x=>x.id===id);if(!r)return;
 if(r.status==='مقبول'&&r.date&&!r.time){const t=prompt('اكتب وقت الموعد (مثال 10:30)');if(t){r.time=t;set('reqs',reqs)}}
 let p=r.phone.replace(/\D/g,'');if(p.startsWith('0'))p='964'+p.slice(1);
 let t=`مرحباً ${r.name}،\nبخصوص طلبك (${r.type}) من منطقة ${r.area} في تجمع الأنصار الشبابي:\n`;
 if(r.status==='مقبول')t+='تم قبول طلبك.'+(when(r)?`\nموعدك: ${when(r)}.`:'')+'\nنرجو الالتزام بالموعد.';
 else if(r.status==='مرفوض')t+='نعتذر، لم نتمكن من قبول طلبك حالياً.';
 else t+='تم استلام طلبك وسنتواصل معك قريباً.';
 window.open(`https://wa.me/${p}?text=${encodeURIComponent(t)}`,'_blank')}
function saveCfg(){cfg.wa=$('wa').value.replace(/\D/g,'');if($('np').value.trim())cfg.pin=$('np').value.trim();$('np').value='';set('cfg',cfg);alert('تم الحفظ')}
function exportCsv(){
 const q=s=>'"'+String(s||'').replace(/"/g,'""')+'"';
 const rows=[['النوع','الاسم','الهاتف','المنطقة','المطلوب','التاريخ','الوقت','التفاصيل','الحالة','وقت الإنشاء']].concat(
  reqs.map(r=>[r.type,r.name,r.phone,r.area,r.who,r.date,r.time,r.note,r.status,r.created]));
 const b=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='requests.csv';a.click()}

const ROLES=['مدير التجمع','معاون مدير','أكاديمي','نخب','خدمي','ثقافي','اجتماعي','إعلام','عضو'];
const DEPTS=['الإدارة','الخدمات','الثقافة','الاجتماعية','الإعلام'];
let mems=get('mems',[]),mEditId=null;
function opts(id,arr,first){$(id).innerHTML=(first?`<option value="">${first}</option>`:'')+arr.map(x=>`<option>${x}</option>`).join('')}
opts('mrole',ROLES);opts('mdept',DEPTS);opts('mfd',DEPTS,'الكل');opts('mfr',ROLES,'الكل');
$('mjoin').value=new Date().toISOString().slice(0,10);
function pane(n){mark(n);$('reqPane').classList.toggle('hid',n!==1);$('memPane').classList.toggle('hid',n!==2);$('setPane').classList.toggle('hid',n!==3);if(n===2)mDraw();if(n===1)draw()}
function mClear(){mEditId=null;['mname','mphone','mnote'].forEach(i=>$(i).value='');$('mjoin').value=new Date().toISOString().slice(0,10);
 $('mstat').value='فعال';$('mrole').selectedIndex=0;$('mdept').selectedIndex=0;$('mtitle').textContent='إضافة عضو';$('msave').textContent='إضافة عضو جديد'}
function mSave(){
 const m={id:mEditId||Date.now(),name:$('mname').value.trim(),role:$('mrole').value,dept:$('mdept').value,phone:$('mphone').value.trim(),
  join:$('mjoin').value,stat:$('mstat').value,note:$('mnote').value.trim()};
 if(!m.name||!m.phone){alert('يرجى كتابة الاسم ورقم الهاتف');return}
 if(mEditId)mems=mems.map(x=>x.id===mEditId?m:x);else mems.push(m);
 set('mems',mems);mClear();mDraw()}
function mEdit(id){const m=mems.find(x=>x.id===id);if(!m)return;mEditId=id;
 $('mname').value=m.name;$('mrole').value=m.role;$('mdept').value=m.dept;$('mphone').value=m.phone;$('mjoin').value=m.join;
 $('mstat').value=m.stat;$('mnote').value=m.note;$('mtitle').textContent='تعديل بيانات عضو';$('msave').textContent='حفظ التعديل';
 $('mname').scrollIntoView({behavior:'smooth',block:'center'})}
function mDel(id){if(confirm('حذف هذا العضو؟')){mems=mems.filter(x=>x.id!==id);set('mems',mems);mDraw()}}
function mFiltered(){const q=$('msearch').value.trim(),d=$('mfd').value,r=$('mfr').value;
 return mems.filter(m=>(!q||m.name.includes(q)||m.phone.includes(q))&&(!d||m.dept===d)&&(!r||m.role===r))}
function mDraw(){const L=mFiltered();$('mcount').textContent=`عدد الأعضاء: ${L.length} من ${mems.length}`;
 $('mlist').innerHTML=L.length?L.map((m,i)=>`<div class="card"><div><b>${i+1}. ${esc(m.name)}</b> <span class="tag ${m.stat==='فعال'?'ok':'no'}">${esc(m.stat)}</span></div>
 <div class="mu">${esc(m.role)} — ${esc(m.dept)}</div><div dir="ltr" style="text-align:right">${esc(m.phone)}</div>
 <div class="mu">الانضمام: ${esc(m.join)}</div>${m.note?`<div>${esc(m.note)}</div>`:''}
 <div class="row"><button onclick="mEdit(${m.id})">تعديل</button><button class="bad" onclick="mDel(${m.id})">حذف</button></div></div>`).join(''):'<div class="card mu">لا يوجد أعضاء</div>'}
function mPrint(){const L=mFiltered();const w=window.open('','_blank');if(!w){alert('اسمح بالنوافذ المنبثقة للطباعة');return}
 w.document.write(`<html dir="rtl"><head><meta charset="utf-8"><title>قائمة الأعضاء</title><style>body{font-family:Tahoma,sans-serif;padding:16px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #999;padding:6px;text-align:center}th{background:#1565c0;color:#fff}</style></head><body><h2 style="text-align:center">تجمع الأنصار الشبابي — قائمة الأعضاء</h2><table><tr><th>#</th><th>الاسم الكامل</th><th>الصفة</th><th>القسم</th><th>الهاتف</th><th>الانضمام</th><th>الحالة</th></tr>`+
 L.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.name)}</td><td>${esc(m.role)}</td><td>${esc(m.dept)}</td><td>${esc(m.phone)}</td><td>${esc(m.join)}</td><td>${esc(m.stat)}</td></tr>`).join('')+'</table></body></html>');
 w.document.close();w.focus();w.print()}
function mCsv(){const q=s=>'"'+String(s||'').replace(/"/g,'""')+'"';
 const rows=[['الاسم','الصفة','القسم','الهاتف','تاريخ الانضمام','الحالة','ملاحظات']].concat(mems.map(m=>[m.name,m.role,m.dept,m.phone,m.join,m.stat,m.note]));
 const b=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='members.csv';a.click()}
</script>
</body>
</html>
